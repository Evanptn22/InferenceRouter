<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inference Router</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161923;
    --panel-2: #1d2130;
    --border: #2a2f40;
    --text: #e6e8ef;
    --muted: #9099b0;
    --accent: #6ea8fe;
    --accent-2: #4c7de0;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .shell {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  header.top h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  header.top p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .key-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .key-box label {
    font-size: 0.75rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .key-box input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.85rem;
    width: 150px;
    outline: none;
  }
  .key-status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--err);
    flex: none;
  }
  .key-status.set { background: var(--ok); }

  nav.tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  nav.tabs button {
    appearance: none;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  .view { display: none; }
  .view.active { display: block; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  td.mono, th.mono { font-family: var(--mono); }
  .price { color: var(--accent); }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  select, textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 10px 12px;
    outline: none;
  }
  select:focus, textarea:focus { border-color: var(--accent-2); }
  textarea { resize: vertical; min-height: 90px; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button.primary, button.ghost {
    font-size: 0.88rem;
    font-weight: 500;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  button.primary {
    background: var(--accent-2);
    color: #fff;
    border: none;
  }
  button.primary:hover { background: var(--accent); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--border);
  }
  button.ghost:hover { color: var(--text); border-color: var(--accent-2); }

  .response {
    margin-top: 18px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .response .meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
    font-family: var(--mono);
  }
  .response .content {
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 0.92rem;
  }

  .summary {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .summary .total {
    font-size: 1.6rem;
    font-family: var(--mono);
  }
  .summary .total span { font-size: 0.9rem; color: var(--muted); margin-left: 6px; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-family: var(--mono);
  }
  .badge.ok { background: rgba(74,222,128,0.15); color: var(--ok); }
  .badge.error { background: rgba(248,113,113,0.15); color: var(--err); }

  .empty { color: var(--muted); font-size: 0.88rem; padding: 8px 2px; }
  .banner {
    font-size: 0.85rem;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .banner.error { background: rgba(248,113,113,0.12); color: var(--err); border: 1px solid rgba(248,113,113,0.3); }
</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <div>
      <h1>Inference Router</h1>
      <p>Browse the model catalog, send a test completion, and track spend.</p>
    </div>
    <div class="key-box">
      <span class="key-status" id="keyStatus"></span>
      <label for="apiKey">x-api-key</label>
      <input id="apiKey" type="password" placeholder="demo-key" autocomplete="off" />
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-view="catalog">Catalog</button>
    <button class="tab-btn" data-view="chat">Chat</button>
    <button class="tab-btn" data-view="usage">Usage</button>
  </nav>

  <!-- Catalog -->
  <section class="view active" id="view-catalog">
    <div class="panel">
      <div id="catalogBody"><p class="empty">Loading catalog…</p></div>
    </div>
  </section>

  <!-- Chat -->
  <section class="view" id="view-chat">
    <div class="panel">
      <div id="chatBanner"></div>
      <div class="field">
        <label for="chatModel">Model</label>
        <select id="chatModel"></select>
      </div>
      <div class="field">
        <label for="chatMessage">Message</label>
        <textarea id="chatMessage" placeholder="Say something…"></textarea>
      </div>
      <div class="row">
        <button class="primary" id="sendBtn">Send</button>
        <span class="empty" id="chatHint"></span>
      </div>
      <div class="response" id="chatResponse" style="display:none">
        <div class="meta" id="chatMeta"></div>
        <div class="content" id="chatContent"></div>
      </div>
    </div>
  </section>

  <!-- Usage -->
  <section class="view" id="view-usage">
    <div class="panel">
      <div id="usageBanner"></div>
      <div class="summary">
        <div>
          <div class="total" id="usageTotal">–<span>USD spent</span></div>
        </div>
        <button class="ghost" id="refreshUsage">Refresh</button>
      </div>
      <div id="usageBody"><p class="empty">Enter an API key and switch to this tab to load usage.</p></div>
    </div>
  </section>

</div>

<script>
(function () {
  const KEY_STORAGE = 'inferenceRouter.apiKey';
  const apiKeyInput = document.getElementById('apiKey');
  const keyStatus = document.getElementById('keyStatus');

  apiKeyInput.value = localStorage.getItem(KEY_STORAGE) || '';
  updateKeyStatus();

  apiKeyInput.addEventListener('input', () => {
    localStorage.setItem(KEY_STORAGE, apiKeyInput.value);
    updateKeyStatus();
  });

  function updateKeyStatus() {
    keyStatus.classList.toggle('set', apiKeyInput.value.trim().length > 0);
  }

  function apiKey() {
    return apiKeyInput.value.trim();
  }

  async function api(path, options = {}) {
    const headers = { 'content-type': 'application/json', ...(options.headers || {}) };
    if (apiKey()) headers['x-api-key'] = apiKey();
    const res = await fetch(path, { ...options, headers });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(body.error || `request failed (${res.status})`);
      err.status = res.status;
      throw err;
    }
    return body;
  }

  // Tab switching
  const tabButtons = document.querySelectorAll('.tab-btn');
  const views = document.querySelectorAll('.view');
  tabButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      tabButtons.forEach((b) => b.classList.remove('active'));
      views.forEach((v) => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
      if (btn.dataset.view === 'usage') loadUsage();
    });
  });

  // Ai model catalog
  let catalogCache = [];

  function fmtPrice(amount, currency) {
    return `$${amount.toFixed(4)} ${currency}`;
  }

  async function loadCatalog() {
    const catalogBody = document.getElementById('catalogBody');
    try {
      const data = await api('/v1/catalog');
      catalogCache = data.models;
      if (catalogCache.length === 0) {
        catalogBody.innerHTML = '<p class="empty">No models configured.</p>';
        return;
      }
      catalogBody.innerHTML = `
        <table>
          <thead>
            <tr><th>ID</th><th>Provider</th><th>Model</th><th>Price / request</th></tr>
          </thead>
          <tbody>
            ${catalogCache.map((m) => `
              <tr>
                <td class="mono">${escapeHtml(m.id)}</td>
                <td>${escapeHtml(m.provider)}</td>
                <td class="mono">${escapeHtml(m.model)}</td>
                <td class="mono price">${fmtPrice(m.pricePerRequestUSD, m.currency)}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
      populateModelSelect();
    } catch (err) {
      catalogBody.innerHTML = `<p class="empty">Failed to load catalog: ${escapeHtml(err.message)}</p>`;
    }
  }

  function populateModelSelect() {
    const select = document.getElementById('chatModel');
    select.innerHTML = catalogCache
      .map((m) => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.id)} — ${escapeHtml(m.provider)} (${fmtPrice(m.pricePerRequestUSD, m.currency)})</option>`)
      .join('');
  }

  // ---- Chat ----
  const sendBtn = document.getElementById('sendBtn');
  const chatBanner = document.getElementById('chatBanner');
  const chatHint = document.getElementById('chatHint');

  sendBtn.addEventListener('click', sendChat);
  document.getElementById('chatMessage').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendChat();
  });

  async function sendChat() {
    const model = document.getElementById('chatModel').value;
    const content = document.getElementById('chatMessage').value.trim();
    const responseBox = document.getElementById('chatResponse');
    chatBanner.innerHTML = '';

    if (!apiKey()) {
      chatBanner.innerHTML = '<div class="banner error">Enter an x-api-key above first.</div>';
      return;
    }
    if (!model || !content) {
      chatBanner.innerHTML = '<div class="banner error">Pick a model and enter a message.</div>';
      return;
    }

    sendBtn.disabled = true;
    chatHint.textContent = 'Waiting for response…';
    responseBox.style.display = 'none';

    try {
      const data = await api('/v1/chat/completions', {
        method: 'POST',
        body: JSON.stringify({ model, messages: [{ role: 'user', content }] }),
      });
      const choice = data.choices?.[0]?.message?.content ?? '';
      document.getElementById('chatMeta').innerHTML = `
        <span>provider: ${escapeHtml(data.provider)}</span>
        <span>price: ${fmtPrice(data.usage.price, data.usage.currency)}</span>
        <span>latency: ${data.usage.latencyMs}ms</span>`;
      document.getElementById('chatContent').textContent = choice;
      responseBox.style.display = 'block';
    } catch (err) {
      chatBanner.innerHTML = `<div class="banner error">${escapeHtml(err.message)}</div>`;
    } finally {
      sendBtn.disabled = false;
      chatHint.textContent = '';
    }
  }

  // ---- Usage ----
  async function loadUsage() {
    const usageBody = document.getElementById('usageBody');
    const usageBanner = document.getElementById('usageBanner');
    const usageTotal = document.getElementById('usageTotal');
    usageBanner.innerHTML = '';

    if (!apiKey()) {
      usageBanner.innerHTML = '<div class="banner error">Enter an x-api-key above first.</div>';
      usageTotal.innerHTML = '–<span>USD spent</span>';
      usageBody.innerHTML = '<p class="empty">No key set.</p>';
      return;
    }

    usageBody.innerHTML = '<p class="empty">Loading…</p>';
    try {
      const data = await api('/v1/usage');
      usageTotal.innerHTML = `${data.totalSpentUSD.toFixed(4)}<span>USD spent</span>`;
      if (data.entries.length === 0) {
        usageBody.innerHTML = '<p class="empty">No requests logged yet for this consumer.</p>';
        return;
      }
      const rows = [...data.entries].reverse();
      usageBody.innerHTML = `
        <table>
          <thead>
            <tr><th>Time</th><th>Model</th><th>Provider</th><th>Status</th><th>Amount</th><th>Latency</th></tr>
          </thead>
          <tbody>
            ${rows.map((r) => `
              <tr>
                <td class="mono">${new Date(r.timestamp).toLocaleString()}</td>
                <td class="mono">${escapeHtml(r.catalogId)}</td>
                <td>${escapeHtml(r.provider)}</td>
                <td><span class="badge ${r.status === 'ok' ? 'ok' : 'error'}">${escapeHtml(r.status)}</span></td>
                <td class="mono price">${fmtPrice(r.amount, r.currency)}</td>
                <td class="mono">${r.latencyMs}ms</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    } catch (err) {
      usageBody.innerHTML = `<p class="empty">Failed to load usage: ${escapeHtml(err.message)}</p>`;
    }
  }

  document.getElementById('refreshUsage').addEventListener('click', loadUsage);

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  loadCatalog();
})();
</script>
</body>
</html>
